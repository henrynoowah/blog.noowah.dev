<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <rect class="sq" x="10" y="10" width="72" height="72" />
    <circle class="ci" cx="90" cy="90" r="38" />
    <style>
        /* dev = olive square, hobbies = terracotta circle — the same pairing
           used for the two content areas throughout the site. */
        .sq { fill: #5f6b39; }
        .ci { fill: #a94a1e; }
        @media (prefers-color-scheme: dark) {
            .sq { fill: #9aa867; }
            .ci { fill: #e07640; }
        }
    </style>
</svg>
